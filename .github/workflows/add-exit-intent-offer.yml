name: Add exit intent offer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-exit-intent-offer.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add exit intent modal
        run: python3 scripts/add_exit_offer.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add exit intent consultation offer"
          git push
