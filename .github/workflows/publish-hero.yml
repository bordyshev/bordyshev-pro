name: Publish hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hero.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild image and update hero
        shell: bash
        run: |
          cat hero-img-1.txt hero-img-2.txt hero-img-3.txt hero-img-4.txt hero-img-5.txt hero-img-6.txt | base64 --decode > hero-photo.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<img src="/photo.jpg" alt="Никита Бордышев">'
          new = '<img src="/hero-photo.webp" alt="Никита Бордышев">'
          if old not in s:
              raise SystemExit('Hero portrait markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm hero-img-1.txt hero-img-2.txt hero-img-3.txt hero-img-4.txt hero-img-5.txt hero-img-6.txt
      - name: Commit published portrait
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hero-photo.webp hero-img-1.txt hero-img-2.txt hero-img-3.txt hero-img-4.txt hero-img-5.txt hero-img-6.txt
          git commit -m "Publish new hero portrait"
          git push
# retry after corrected image data
