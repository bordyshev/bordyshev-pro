name: Update MAX contact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-max.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contact section and chat
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Could not find expected block: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '.contact-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-bottom:2.75rem;}',
              '.contact-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:2.75rem;}',
              'contact grid'
          )

          marker = '    <div class="contact-cards fi">\n'
          max_card = '''      <a href="https://max.ru/u/f9LHodD0cOJBV1T3BpTBwe68VrgL1G6RXTrwWW2RSpDvZWPYYeOesmhELEY" target="_blank" rel="noopener" class="c-card">\n        <div class="c-icon" style="background:#2563EB;color:#fff;font-family:var(--fh);font-size:.72rem;font-weight:700;letter-spacing:.04em;">MAX</div>\n        <div class="c-label">MAX</div><div class="c-val">Написать в MAX</div>\n      </a>\n'''
          if 'https://max.ru/u/f9LHodD0cOJBV1T3BpTBwe68VrgL1G6RXTrwWW2RSpDvZWPYYeOesmhELEY' not in s:
              replace_once(marker, marker + max_card, 'contact cards marker')

          replace_once(
              '<div class="chat-msg">Привет! 👋 Есть вопрос или задача? Напишите — отвечу в Telegram.</div>',
              '<div class="chat-msg">Привет! 👋 Есть вопрос или задача? Напишите — отвечу в MAX.</div>',
              'chat greeting'
          )

          replace_once(
              '<div class="chat-note">Нажимая кнопку, вы откроете Telegram.<br>Или напишите напрямую: <a href="https://t.me/bordyshev_official" target="_blank">@bordyshev_official</a></div>',
              '<div class="chat-note">Нажимая кнопку, вы откроете MAX.<br>Текст сообщения скопируется — останется вставить его в чат.</div>',
              'chat note'
          )

          replace_once(
              '<div id="chat-bubble" title="Написать Никите">',
              '<div id="chat-bubble" title="Написать Никите в MAX">',
              'chat bubble title'
          )

          old_send = '''function sendMsg(){\n  const txt=inp.value.trim();\n  const url=txt\n    ? `https://t.me/bordyshev_official?text=${encodeURIComponent(txt)}`\n    : 'https://t.me/bordyshev_official';\n  window.open(url,'_blank');\n  inp.value='';\n}'''
          new_send = '''function sendMsg(){\n  const txt=inp.value.trim();\n  const maxUrl='https://max.ru/u/f9LHodD0cOJBV1T3BpTBwe68VrgL1G6RXTrwWW2RSpDvZWPYYeOesmhELEY';\n  if(txt && navigator.clipboard){ navigator.clipboard.writeText(txt).catch(()=>{}); }\n  window.open(maxUrl,'_blank');\n  inp.value='';\n}'''
          replace_once(old_send, new_send, 'sendMsg')

          path.write_text(s, encoding='utf-8')

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "bordyshev"
          git config user.email "nikitagold@mail.ru"
          git add index.html
          git commit -m "Add MAX contact and connect chat to MAX"
          git push
