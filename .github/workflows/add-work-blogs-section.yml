name: Add work blogs section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-work-blogs-section.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="workBlogs"' in s:
              raise SystemExit('Work blogs section already exists')
          css = base64.b64decode('').decode('utf-8')
          section = base64.b64decode('').decode('utf-8')
          tracking = base64.b64decode('').decode('utf-8')
          marker = '<section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Коротко</div><h2>Частые вопросы</h2></div>'
          if marker not in s:
              raise SystemExit('FAQ marker not found')
          s = s.replace('  </style>', '    ' + css + '  </style>', 1)
          s = s.replace(marker, section + '\n' + marker, 1)
          s = s.replace('</body>', tracking + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add work blogs trust section and Metrika goals"
          git push
