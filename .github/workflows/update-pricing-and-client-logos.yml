name: Update pricing and client logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pricing-and-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update portfolio page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Navigation
          s = s.replace(
              '<a href="#solutions">Решения</a><a href="#cases">Реальные проекты</a><a href="#process">Как работаю</a><a href="#about">Обо мне</a>',
              '<a href="#solutions">Решения</a><a href="#cases">Реальные проекты</a><a href="#prices">Стоимость</a><a href="#process">Как работаю</a><a href="#about">Обо мне</a>'
          )

          # Client logo strip styles + pricing styles
          old_css = '.more-work{margin-top:22px;background:#fff;border:1px solid var(--line);padding:21px 23px}.more-work strong{display:block;margin-bottom:8px}.more-work p{margin:0;color:var(--muted);font-size:.82rem}'
          new_css = '''.more-work{margin-top:22px;background:#fff;border:1px solid var(--line);padding:21px 23px}.more-work strong{display:block;margin-bottom:14px}.client-logos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.client-logo{min-height:92px;border:1px solid var(--line);background:#faf9f6;display:flex;align-items:center;justify-content:center;padding:14px;transition:.2s ease}.client-logo:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.client-logo img{width:58px;height:58px;object-fit:contain}.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.price-card{background:#fff;border:1px solid var(--line);padding:25px 23px;display:flex;flex-direction:column;min-height:220px}.price-card h3{font-family:var(--fh);font-size:1.25rem;text-transform:uppercase;line-height:1.15;margin:0 0 .7rem}.price-card p{font-size:.82rem;color:var(--muted);margin:0 0 1.2rem}.price{font-family:var(--fh);font-size:2rem;line-height:1;color:var(--red);margin-top:auto}.price small{font-family:var(--fb);font-size:.72rem;color:var(--muted);font-weight:500}.price-note{margin-top:18px;padding:16px 18px;background:#fff;border-left:3px solid var(--red);font-size:.82rem;color:#555}'''
          if old_css not in s:
              raise SystemExit('Old more-work CSS not found')
          s = s.replace(old_css, new_css, 1)

          # Responsive pricing / logo grids
          s = s.replace(
              '.case-grid{grid-template-columns:1fr 1fr}.about-card,.final-grid{grid-template-columns:1fr}',
              '.case-grid{grid-template-columns:1fr 1fr}.client-logos{grid-template-columns:repeat(4,1fr)}.pricing-grid{grid-template-columns:repeat(2,1fr)}.about-card,.final-grid{grid-template-columns:1fr}',
              1
          )
          s = s.replace(
              '.principles-grid,.solutions,.funnel,.case-grid,.service-grid,.process,.faq{grid-template-columns:1fr}',
              '.principles-grid,.solutions,.funnel,.case-grid,.service-grid,.process,.pricing-grid,.faq{grid-template-columns:1fr}.client-logos{grid-template-columns:repeat(2,1fr)}',
              1
          )

          # Replace text list with actual brand marks pulled from the companies' official domains.
          old_more = '<div class="more-work"><strong>Также работал с интернет-магазинами, локальными услугами и производством.</strong><p>Start Line, «Пробиотики Сибири», DrevoNSK, «Клинтайм 54», «ПоШву», N‑Tkani, #Посуши и другие. В старых проектах текущий сайт мог быть изменён владельцем после завершения моей работы.</p></div>'
          new_more = '''<div class="more-work"><strong>Также работал с интернет-магазинами, локальными услугами и производством.</strong><div class="client-logos" aria-label="Другие компании, с которыми работал"><a class="client-logo" href="https://start-line.ru/" target="_blank" rel="noopener" title="Start Line"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://start-line.ru" alt="Логотип Start Line"></a><a class="client-logo" href="https://probiotics54.ru/" target="_blank" rel="noopener" title="Пробиотики Сибири"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://probiotics54.ru" alt="Логотип Пробиотики Сибири"></a><a class="client-logo" href="https://drevonsk.ru/" target="_blank" rel="noopener" title="DrevoNSK"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://drevonsk.ru" alt="Логотип DrevoNSK"></a><a class="client-logo" href="https://klintime.ru/" target="_blank" rel="noopener" title="Клинтайм 54"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://klintime.ru" alt="Логотип Клинтайм 54"></a><a class="client-logo" href="https://poshvu.su/" target="_blank" rel="noopener" title="ПоШву"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://poshvu.su" alt="Логотип ПоШву"></a><a class="client-logo" href="https://n-tkani.ru/" target="_blank" rel="noopener" title="N-Tkani"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://n-tkani.ru" alt="Логотип N-Tkani"></a><a class="client-logo" href="https://xn--h1alcjk4a.xn--p1ai/" target="_blank" rel="noopener" title="#Посуши"><img loading="lazy" src="https://www.google.com/s2/favicons?sz=256&domain_url=https://xn--h1alcjk4a.xn--p1ai" alt="Логотип Посуши"></a></div></div>'''
          if old_more not in s:
              raise SystemExit('Old more-work block not found')
          s = s.replace(old_more, new_more, 1)

          # Pricing section before process.
          process_marker = '  <section class="section" id="process">'
          pricing = '''  <section class="section" id="prices"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Стоимость</div><h2>Понятные ориентиры до созвона</h2></div><p>Финальная смета зависит от объёма, интеграций и состояния текущего проекта. Но базовый порядок цен можно понять сразу.</p></div><div class="pricing-grid"><article class="price-card"><h3>Лендинг / страница услуги</h3><p>Продающая структура, адаптив, формы, аналитика и базовая SEO-подготовка.</p><div class="price">от 35 000 ₽</div></article><article class="price-card"><h3>Корпоративный сайт</h3><p>Многостраничная структура под услуги, кейсы, SEO-посадочные и дальнейшее развитие.</p><div class="price">от 65 000 ₽</div></article><article class="price-card"><h3>Интернет-магазин</h3><p>Каталог, карточки товаров, корзина, оплата и необходимые интеграции.</p><div class="price">от 90 000 ₽</div></article><article class="price-card"><h3>SEO-продвижение</h3><p>Техническая оптимизация, семантика, структура, контент и работа с точками роста.</p><div class="price">от 25 000 ₽ <small>/ мес.</small></div></article><article class="price-card"><h3>CRM и автоматизация</h3><p>Воронка, карточки, формы, уведомления, интеграции и автоматические действия.</p><div class="price">от 30 000 ₽</div></article><article class="price-card"><h3>Telegram / AI-бот</h3><p>Сценарии, база данных, интеграции, AI-функции и автоматизация рутины.</p><div class="price">от 30 000 ₽</div></article></div><div class="price-note"><strong>Экспресс-разбор из письма — бесплатно.</strong> Если нужен полноценный аудит сайта с конкурентами, SEO и планом внедрения — от 10 000 ₽. Лицензии сторонних сервисов и рекламный бюджет оплачиваются отдельно.</div></div></section>\n'''
          if process_marker not in s:
              raise SystemExit('Process marker not found')
          s = s.replace(process_marker, pricing + process_marker, 1)

          s = s.replace(
              '<details><summary>Сколько стоит работа?</summary><p>Зависит от объёма и текущего состояния проекта. Я предпочитаю сначала определить конкретную задачу, а потом оценить её, вместо продажи фиксированного «пакета», половина которого бизнесу не нужна.</p></details>',
              '<details><summary>Сколько стоит работа?</summary><p>На сайте есть стартовые цены «от»: лендинг — от 35 000 ₽, корпоративный сайт — от 65 000 ₽, SEO — от 25 000 ₽/мес., CRM и автоматизация — от 30 000 ₽. Точную смету фиксирую после короткого разбора задачи.</p></details>',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/update-pricing-and-client-logos.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-pricing-and-client-logos.yml
          git commit -m "Add client logos and pricing section"
          git push
